<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>便利ツール集</title>
  <meta name="description" content="ブラウザだけで使える、シンプルな便利ツール集です。" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5093421396736590"
     crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7785;
      --border: #dde2e8;
      --accent: #2f7de1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191e;
        --card: #1f252c;
        --text: #e6eaef;
        --muted: #9aa5b1;
        --border: #333c46;
        --accent: #5a9cf0;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    h1 { text-align: center; margin: 0 0 4px; font-size: 1.8rem; }
    .subtitle { text-align: center; margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }

    .tools { list-style: none; margin: 0; padding: 0; }

    .tool {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }

    .tool:hover, .tool:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
    .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tool-icon {
      flex: none;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tool-body { flex: 1; min-width: 0; }
    .tool-name { display: block; margin: 0; font-weight: 600; font-size: 1.05rem; }
    .tool-desc { display: block; margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
    .tool-arrow { flex: none; color: var(--muted); font-size: 1.2rem; }

    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 16px 32px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>便利ツール集</h1>
    <p class="subtitle">ブラウザだけで使える、シンプルなツールを集めました。<br />登録不要・無料でご利用いただけます。</p>

    <ul class="tools">
      <li>
        <a class="tool" href="bmi/">
          <span class="tool-icon" aria-hidden="true">BMI</span>
          <span class="tool-body">
            <span class="tool-name">BMI計算</span>
            <span class="tool-desc">身長と体重からBMI・肥満度・適正体重を計算。履歴をグラフで確認できます。</span>
          </span>
          <span class="tool-arrow" aria-hidden="true">›</span>
        </a>
      </li>
      <li>
        <a class="tool" href="water/">
          <span class="tool-icon" aria-hidden="true">水</span>
          <span class="tool-body">
            <span class="tool-name">水分量・カフェイン計算</span>
            <span class="tool-desc">体重と運動量から1日に必要な水分量を計算。今日のカフェイン量が上限内かもチェックできます。</span>
          </span>
          <span class="tool-arrow" aria-hidden="true">›</span>
        </a>
      </li>
      <li>
        <a class="tool" href="blocks/">
          <span class="tool-icon" aria-hidden="true">遊</span>
          <span class="tool-body">
            <span class="tool-name">ブロック落としパズル</span>
            <span class="tool-desc">落ちてくるブロックで横一列をそろえて消すパズルゲーム。スマホのタップ・スワイプにも対応。</span>
          </span>
          <span class="tool-arrow" aria-hidden="true">›</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>&copy; tools.e-seventh.com</footer>
</body>
</html>
