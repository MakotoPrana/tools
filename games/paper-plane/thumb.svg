<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。窓から原っぱへ飛んでいく紙ひこうき -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9fe0"/>
      <stop offset="1" stop-color="#cfe9f8"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cbb58"/>
      <stop offset="1" stop-color="#5a9a3e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- 雲 -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="236" cy="38" rx="26" ry="9"/>
    <ellipse cx="256" cy="33" rx="16" ry="8"/>
    <ellipse cx="120" cy="28" rx="18" ry="6"/>
  </g>
  <!-- 原っぱと距離の線 -->
  <path d="M0 122 H320 V200 H0 Z" fill="url(#grass)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5">
    <path d="M70 200 Q190 150 320 168"/>
    <path d="M110 160 Q200 136 320 142"/>
    <path d="M150 140 Q230 128 320 130"/>
  </g>
  <!-- 木 -->
  <g fill="#3f8a3a">
    <circle cx="150" cy="116" r="7"/><circle cx="164" cy="114" r="8"/><circle cx="180" cy="117" r="6"/>
    <circle cx="214" cy="115" r="8"/><circle cx="232" cy="117" r="6"/><circle cx="262" cy="114" r="8"/>
    <circle cx="284" cy="116" r="7"/><circle cx="304" cy="115" r="8"/>
  </g>
  <!-- 窓の枠 (部屋の中から見る) -->
  <path d="M0 0 H92 V200 H0 Z" fill="#ece3d3"/>
  <path d="M86 0 H96 V200 H86 Z" fill="#f7f5f0"/>
  <path d="M0 150 H96 V200 H0 Z" fill="#d9cdb8"/>
  <rect x="10" y="20" width="30" height="120" rx="4" fill="#9cc3d8"/>
  <!-- 飛んだ跡 -->
  <path d="M84 132 Q140 70 196 76" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <!-- 紙ひこうき -->
  <g transform="translate(212 74) rotate(-8)">
    <path d="M24 0 L-26 -8 L-20 0 Z" fill="#f7f4ec"/>
    <path d="M24 0 L-28 14 L-20 0 Z" fill="#e8473d"/>
    <path d="M24 0 L-24 -18 L-26 -8 Z" fill="#c9362e"/>
    <path d="M24 0 L-20 0 L-22 6 Z" fill="#a82a23"/>
  </g>
  <!-- 記録 -->
  <rect x="230" y="160" width="76" height="26" rx="13" fill="#10202e" fill-opacity="0.65"/>
  <text x="268" y="178" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">52.3 m</text>
</svg>
