<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。ポップな山につづら折りの酷道、山頂に山小屋、手前にトラック -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset="1" stop-color="#d9f4ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- 雲 -->
  <g fill="#ffffff">
    <polygon points="34,40 48,30 66,32 76,42 64,48 40,48"/>
    <polygon points="236,26 252,18 270,20 280,30 266,36 242,36"/>
  </g>
  <!-- 奥の山 -->
  <polygon points="180,150 252,62 320,128 320,150" fill="#8ccf6e"/>
  <polygon points="252,62 238,80 262,78" fill="#ffffff"/>
  <!-- てっぺん岳 -->
  <polygon points="40,170 150,34 270,170" fill="#7fd65a"/>
  <polygon points="150,34 96,100 150,92" fill="#6cc95a"/>
  <polygon points="150,34 132,56 168,56" fill="#ffffff"/>
  <!-- つづら折りの酷道 -->
  <polyline points="186,170 112,150 212,132 120,116 190,100 134,86 170,72 150,58" fill="none" stroke="#e0a86e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="186,170 112,150 212,132 120,116 190,100 134,86 170,72 150,58" fill="none" stroke="#7d7a76" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 山小屋と旗 -->
  <rect x="140" y="46" width="16" height="10" fill="#c07a45"/>
  <polygon points="137,47 148,38 159,47" fill="#ef476f"/>
  <line x1="162" y1="56" x2="162" y2="34" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="162" y="34" width="9" height="6" fill="#ffd23f"/>
  <!-- 地面 -->
  <rect y="165" width="320" height="35" fill="#9be564"/>
  <rect y="178" width="320" height="22" fill="#707a8f"/>
  <g fill="#ffffff">
    <rect x="10" y="187" width="22" height="3"/>
    <rect x="60" y="187" width="22" height="3"/>
    <rect x="110" y="187" width="22" height="3"/>
    <rect x="160" y="187" width="22" height="3"/>
    <rect x="210" y="187" width="22" height="3"/>
    <rect x="260" y="187" width="22" height="3"/>
  </g>
  <!-- 木 -->
  <g>
    <rect x="22" y="152" width="4" height="14" fill="#9a6a43"/>
    <circle cx="24" cy="148" r="11" fill="#5cc95f"/>
    <rect x="294" y="150" width="4" height="16" fill="#9a6a43"/>
    <polygon points="296,128 284,154 308,154" fill="#2fa36b"/>
  </g>
  <!-- トラック -->
  <g>
    <rect x="200" y="140" width="62" height="34" rx="2" fill="#ffffff" stroke="#1d2340" stroke-width="2"/>
    <rect x="200" y="160" width="62" height="6" fill="#ff5c8a"/>
    <text x="231" y="155" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1d2340" text-anchor="middle">ぽっぷ運送</text>
    <path d="M262 150 h18 l10 12 v12 h-28 z" fill="#2ec4b6" stroke="#1d2340" stroke-width="2"/>
    <path d="M266 153 h12 l7 9 h-19 z" fill="#9fe3ff"/>
    <circle cx="216" cy="176" r="7" fill="#22252e"/>
    <circle cx="216" cy="176" r="3" fill="#f1f3f8"/>
    <circle cx="276" cy="176" r="7" fill="#22252e"/>
    <circle cx="276" cy="176" r="3" fill="#f1f3f8"/>
  </g>
  <!-- 落石注意 -->
  <line x1="74" y1="178" x2="74" y2="150" stroke="#c9ced8" stroke-width="2"/>
  <rect x="64" y="132" width="20" height="20" fill="#ffd23f" stroke="#1d2340" stroke-width="2" transform="rotate(45 74 142)"/>
  <text x="74" y="146" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d2340" text-anchor="middle">!</text>
</svg>
