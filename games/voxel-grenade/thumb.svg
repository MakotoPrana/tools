<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。ボクセルの家の右半分が爆発でくずれる -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a"/>
      <stop offset="1" stop-color="#f39a4c"/>
    </linearGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.45" stop-color="#ffb43a"/>
      <stop offset="0.8" stop-color="#ff5a1f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grass" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#6f9a45"/>
      <rect width="12" height="12" fill="#668f3f"/>
      <rect x="12" y="12" width="12" height="12" fill="#668f3f"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <rect y="150" width="320" height="50" fill="url(#grass)"/>

  <!-- 屋根 -->
  <g stroke="rgba(0,0,0,0.25)" stroke-width="1">
    <rect x="56" y="70" width="12" height="12" fill="#c9412c"/>
    <rect x="68" y="58" width="12" height="12" fill="#c9412c"/>
    <rect x="68" y="70" width="12" height="12" fill="#b23a28"/>
    <rect x="80" y="46" width="12" height="12" fill="#c9412c"/>
    <rect x="80" y="58" width="12" height="12" fill="#b23a28"/>
    <rect x="92" y="34" width="12" height="12" fill="#c9412c"/>
    <rect x="92" y="46" width="12" height="12" fill="#b23a28"/>
    <rect x="104" y="34" width="12" height="12" fill="#c9412c"/>
    <rect x="104" y="46" width="12" height="12" fill="#b23a28"/>
    <rect x="116" y="46" width="12" height="12" fill="#c9412c"/>
    <rect x="116" y="58" width="12" height="12" fill="#b23a28"/>
    <rect x="80" y="70" width="12" height="12" fill="#e9d2b0"/>
    <rect x="92" y="58" width="12" height="12" fill="#e9d2b0"/>
    <rect x="92" y="70" width="12" height="12" fill="#e9d2b0"/>
    <rect x="104" y="58" width="12" height="12" fill="#e9d2b0"/>
    <rect x="104" y="70" width="12" height="12" fill="#e9d2b0"/>
    <rect x="116" y="70" width="12" height="12" fill="#e9d2b0"/>
  </g>
  <!-- 壁 (左は残り、右はくずれている) -->
  <g stroke="rgba(0,0,0,0.25)" stroke-width="1">
    <rect x="68" y="82" width="12" height="12" fill="#8a5a32"/>
    <rect x="80" y="82" width="12" height="12" fill="#7d5230"/>
    <rect x="92" y="82" width="12" height="12" fill="#8a5a32"/>
    <rect x="104" y="82" width="12" height="12" fill="#7d5230"/>
    <rect x="116" y="82" width="12" height="12" fill="#8a5a32"/>
    <rect x="68" y="94" width="12" height="12" fill="#7d5230"/>
    <rect x="80" y="94" width="12" height="12" fill="#9fdaf3"/>
    <rect x="92" y="94" width="12" height="12" fill="#9fdaf3"/>
    <rect x="104" y="94" width="12" height="12" fill="#7d5230"/>
    <rect x="116" y="94" width="12" height="12" fill="#8a5a32"/>
    <rect x="68" y="106" width="12" height="12" fill="#8a5a32"/>
    <rect x="80" y="106" width="12" height="12" fill="#9fdaf3"/>
    <rect x="92" y="106" width="12" height="12" fill="#9fdaf3"/>
    <rect x="104" y="106" width="12" height="12" fill="#8a5a32"/>
    <rect x="116" y="106" width="12" height="12" fill="#7d5230"/>
    <rect x="68" y="118" width="12" height="12" fill="#7d5230"/>
    <rect x="80" y="118" width="12" height="12" fill="#8a5a32"/>
    <rect x="92" y="118" width="12" height="12" fill="#6b4426"/>
    <rect x="104" y="118" width="12" height="12" fill="#6b4426"/>
    <rect x="116" y="118" width="12" height="12" fill="#8a5a32"/>
    <rect x="68" y="130" width="12" height="12" fill="#8a5a32"/>
    <rect x="80" y="130" width="12" height="12" fill="#7d5230"/>
    <rect x="92" y="130" width="12" height="12" fill="#6b4426"/>
    <rect x="104" y="130" width="12" height="12" fill="#6b4426"/>
    <rect x="116" y="130" width="12" height="12" fill="#7d5230"/>
    <rect x="68" y="142" width="12" height="12" fill="#7d5230"/>
    <rect x="80" y="142" width="12" height="12" fill="#8a5a32"/>
    <rect x="92" y="142" width="12" height="12" fill="#6b4426"/>
    <rect x="104" y="142" width="12" height="12" fill="#6b4426"/>
    <rect x="116" y="142" width="12" height="12" fill="#8a5a32"/>
    <rect x="128" y="130" width="12" height="12" fill="#7d5230"/>
    <rect x="128" y="142" width="12" height="12" fill="#8a5a32"/>
    <rect x="140" y="142" width="12" height="12" fill="#7d5230"/>
  </g>

  <!-- 爆発 -->
  <circle cx="186" cy="112" r="62" fill="url(#boom)"/>
  <circle cx="186" cy="112" r="22" fill="#fffbe0" opacity="0.9"/>

  <!-- 飛び散るブロック -->
  <g stroke="rgba(0,0,0,0.3)" stroke-width="1">
    <rect x="232" y="56" width="12" height="12" fill="#c9412c" transform="rotate(25 238 62)"/>
    <rect x="258" y="88" width="10" height="10" fill="#8a5a32" transform="rotate(-20 263 93)"/>
    <rect x="214" y="34" width="9" height="9" fill="#e9d2b0" transform="rotate(40 218 38)"/>
    <rect x="150" y="40" width="10" height="10" fill="#c9412c" transform="rotate(-35 155 45)"/>
    <rect x="272" y="128" width="12" height="12" fill="#7d5230" transform="rotate(15 278 134)"/>
    <rect x="244" y="140" width="11" height="11" fill="#c9412c" transform="rotate(-10 249 145)"/>
    <rect x="160" y="150" width="12" height="12" fill="#8a5a32" transform="rotate(8 166 156)"/>
    <rect x="178" y="146" width="12" height="12" fill="#c9412c" transform="rotate(-18 184 152)"/>
    <rect x="200" y="152" width="10" height="10" fill="#9fdaf3" transform="rotate(30 205 157)"/>
    <rect x="290" y="70" width="8" height="8" fill="#c9412c" transform="rotate(50 294 74)"/>
    <rect x="236" y="20" width="7" height="7" fill="#8a5a32" transform="rotate(12 239 23)"/>
  </g>

  <!-- 手榴弾 -->
  <g transform="translate(262 34) rotate(-25)">
    <ellipse cx="0" cy="6" rx="10" ry="12" fill="#3d4f2a" stroke="#22201c" stroke-width="2"/>
    <rect x="-4" y="-10" width="8" height="6" rx="1" fill="#9a9a9a" stroke="#22201c" stroke-width="1.5"/>
    <path d="M4 -8 q10 -4 10 6" fill="none" stroke="#22201c" stroke-width="2"/>
  </g>

  <!-- 80% -->
  <g font-family="Arial Black, sans-serif" font-weight="900">
    <rect x="12" y="12" width="96" height="16" rx="4" fill="#fffaf0" stroke="#22201c" stroke-width="2"/>
    <rect x="14" y="14" width="78" height="12" rx="2" fill="#ff5a1f"/>
    <line x1="88" y1="12" x2="88" y2="28" stroke="#22201c" stroke-width="2"/>
  </g>
</svg>
