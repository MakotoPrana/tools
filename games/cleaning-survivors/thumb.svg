<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。左が汚れた床、右がピカピカの床 -->
  <defs>
    <pattern id="wood" width="64" height="16" patternUnits="userSpaceOnUse">
      <rect width="64" height="16" fill="#d6b183"/>
      <rect y="15" width="64" height="1" fill="#a9824f"/>
      <rect x="37" width="1" height="15" fill="#a9824f"/>
    </pattern>
    <linearGradient id="grime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f362b" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#4a4034" stop-opacity="0.8"/>
      <stop offset="0.62" stop-color="#4a4034" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cone" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#aadcff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#aadcff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="dust" viewBox="-12 -12 24 24">
      <g fill="#a39d94">
        <circle r="6.2"/><circle cx="-4.5" cy="-2.5" r="4.8"/><circle cx="4.5" cy="-2" r="5"/><circle cx="-3.5" cy="3.5" r="4.5"/><circle cx="3.8" cy="3.8" r="4.6"/>
      </g>
      <circle cx="-3" cy="-1" r="2.2" fill="#fff"/><circle cx="3" cy="-1" r="2.2" fill="#fff"/>
      <circle cx="-2.6" cy="-0.7" r="1.1" fill="#111"/><circle cx="3.4" cy="-0.7" r="1.1" fill="#111"/>
    </symbol>
    <symbol id="eyes" viewBox="-10 -10 20 20">
      <circle cx="-3" cy="-1" r="2.4" fill="#fff"/><circle cx="3" cy="-1" r="2.4" fill="#fff"/>
      <circle cx="-2.5" cy="-0.6" r="1.2" fill="#111"/><circle cx="3.5" cy="-0.6" r="1.2" fill="#111"/>
      <path d="M-6 -5 L-1 -3 M6 -5 L1 -3" stroke="#111" stroke-width="1.2"/>
    </symbol>
  </defs>

  <rect width="320" height="200" fill="url(#wood)"/>
  <rect width="320" height="200" fill="url(#grime)"/>
  <!-- ピカピカ -->
  <g fill="#fff">
    <path d="M250 40 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z"/>
    <path d="M290 120 l1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5 5 -1.5z"/>
    <path d="M220 160 l1.5 5 5 1.5 -5 1.5 -1.5 5 -1.5 -5 -5 -1.5 5 -1.5z"/>
  </g>

  <!-- 吸引範囲 -->
  <path d="M190 100 L95 55 A105 105 0 0 0 95 145 Z" fill="url(#cone)" transform="rotate(0)"/>

  <!-- ゴミ -->
  <use href="#dust" x="60" y="40" width="34" height="34"/>
  <use href="#dust" x="30" y="110" width="30" height="30"/>
  <use href="#dust" x="110" y="78" width="26" height="26" opacity="0.8"/>
  <use href="#dust" x="132" y="96" width="16" height="16" opacity="0.6"/>
  <g transform="translate(70 160) rotate(-20)">
    <rect x="-14" y="-10" width="28" height="20" rx="5" fill="#d23b3b"/>
    <rect x="-14" y="-10" width="4" height="20" fill="#c9ced6"/><rect x="10" y="-10" width="4" height="20" fill="#c9ced6"/>
  </g>
  <use href="#eyes" x="58" y="148" width="24" height="24"/>
  <g transform="translate(25 60)">
    <path d="M14 0 L5 12 L-10 9 L-14 -2 L-6 -13 L8 -12 Z" fill="#f2efe6" stroke="#b8b2a3"/>
    <use href="#eyes" x="-11" y="-11" width="22" height="22"/>
  </g>
  <g transform="translate(120 160)">
    <path d="M-20 0 Q-22 -16 -6 -18 Q0 -22 6 -18 Q22 -16 20 0 Q20 14 0 16 Q-20 14 -20 0 Z" fill="#c9a227"/>
    <ellipse cx="-7" cy="-10" rx="6" ry="3" fill="#fffac8" opacity="0.6"/>
    <use href="#eyes" x="-11" y="-11" width="22" height="22"/>
  </g>

  <!-- 清掃員 -->
  <g transform="translate(205 100)">
    <ellipse cy="22" rx="20" ry="6" fill="#000" opacity="0.25"/>
    <path d="M-8 6 L-28 2" stroke="#59616b" stroke-width="7" stroke-linecap="round"/>
    <rect x="-38" y="-8" width="10" height="20" fill="#e04f3a"/>
    <rect x="-15" y="-6" width="30" height="25" rx="10" fill="#2f6fb3"/>
    <circle cy="-14" r="13" fill="#f2c79e"/>
    <path d="M-13.5 -17 A13.5 13.5 0 0 1 13.5 -17 Z" fill="#f08a24"/>
    <rect x="-20" y="-19" width="20" height="5" fill="#f08a24"/>
    <circle cx="-6" cy="-11" r="2" fill="#222"/><circle cx="3" cy="-11" r="2" fill="#222"/>
  </g>

  <!-- ロボ -->
  <g transform="translate(270 160)">
    <circle r="16" fill="#3a4350"/>
    <circle r="11" fill="none" stroke="#7fe8c7" stroke-width="2.5"/>
    <circle cy="-6" r="2.5" fill="#7fe8c7"/>
  </g>
</svg>
