  <ellipse cx="160" cy="132" rx="16" ry="5" fill="#000" opacity=".25"/>
  <g stroke="#1a2a30" stroke-width="2.5">
    <rect x="147" y="104" width="26" height="22" rx="8" fill="#3fc8b0"/>
    <rect x="153" y="111" width="14" height="10" fill="#fff" stroke="none"/>
    <circle cx="160" cy="94" r="12.5" fill="#ffd9b0"/>
    <path d="M148 92 A12.5 12.5 0 0 1 172 92Z" fill="#f2f6f8"/>
  </g>
  <circle cx="156" cy="97" r="2" fill="#1a1a22"/><circle cx="165" cy="97" r="2" fill="#1a1a22"/>
  <!-- 2 -->
  <text x="296" y="190" text-anchor="end" font-family="system-ui,sans-serif" font-weight="900" font-size="64" fill="#ffd23a" stroke="#3a2a08" stroke-width="5" paint-order="stroke" transform="rotate(6 280 170)">2</text>
