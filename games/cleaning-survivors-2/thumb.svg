    <g fill="#5f9a48"><circle cx="210" cy="30" r="3"/><circle cx="262" cy="64" r="4"/><circle cx="300" cy="24" r="3"/><circle cx="238" cy="118" r="4"/><circle cx="292" cy="150" r="3"/><circle cx="200" cy="172" r="4"/><circle cx="170" cy="150" r="3"/></g>
    <g fill="#f2d24a"><circle cx="284" cy="96" r="4"/><circle cx="292" cy="102" r="4"/><circle cx="280" cy="104" r="4"/></g>
  </g>
  <polygon points="188,0 192,0 132,200 128,200" fill="#fff" opacity=".8"/>
  <!-- 掃除機の扇 -->
  <path d="M160 108 L78 52 A100 100 0 0 0 62 128 Z" fill="#bfeaff" opacity=".55"/>
  <!-- 回る水の筋 -->
  <g stroke="#96dcff" stroke-width="7" stroke-linecap="round" opacity=".85"><path d="M172 100 L236 58M170 118 L214 172"/></g>
  <g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M172 100 L236 58M170 118 L214 172"/></g>
  <!-- ゴミ: ホコリ・空き缶・落ち葉・泥 -->
  <g stroke="#1a1a22" stroke-opacity=".6" stroke-width="2">
    <circle cx="52" cy="76" r="13" fill="#b9b4ab"/><circle cx="84" cy="110" r="11" fill="#b9b4ab"/><circle cx="40" cy="126" r="12" fill="#b9b4ab"/>
    <rect x="92" y="52" width="18" height="26" rx="4" fill="#d9483b" transform="rotate(-18 101 65)"/>
    <path d="M250 28 Q270 44 250 62 Q230 44 250 28Z" fill="#d98a2b"/><path d="M284 52 Q300 64 284 80 Q268 64 284 52Z" fill="#d98a2b"/>
    <path d="M232 150 a20 18 0 0 1 40 0 q-5 12 -10 2 q-5 12 -10 2 q-5 12 -10 2 q-5 10 -10 -6Z" fill="#7a5a3a"/>
  </g>
  <use href="#eyes" x="42" y="71" width="20" height="10"/><use href="#eyes" x="75" y="106" width="18" height="9"/><use href="#eyes" x="31" y="121" width="18" height="9"/>
  <use href="#eyes" x="92" y="58" width="18" height="9"/><use href="#eyes" x="241" y="38" width="18" height="9"/><use href="#eyes" x="275" y="60" width="18" height="9"/><use href="#eyes" x="242" y="140" width="20" height="10"/>
  <!-- ダスト -->
  <g fill="#6ad0ff" stroke="#fff" stroke-width="1"><path d="M120 150l4 5-4 5-4-5z"/><path d="M196 36l4 5-4 5-4-5z"/><path d="M146 60l4 5-4 5-4-5z"/></g>
