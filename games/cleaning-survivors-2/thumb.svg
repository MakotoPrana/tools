<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。左が家の中、右が外 -->
  <defs>
    <clipPath id="in"><polygon points="0,0 190,0 130,200 0,200"/></clipPath>
    <clipPath id="out"><polygon points="190,0 320,0 320,200 130,200"/></clipPath>
    <symbol id="eyes" viewBox="-10 -5 20 10"><circle cx="-4" r="3" fill="#fff"/><circle cx="4" r="3" fill="#fff"/><circle cx="-3.6" cy=".4" r="1.5" fill="#1a1a22"/><circle cx="4.4" cy=".4" r="1.5" fill="#1a1a22"/></symbol>
  </defs>
  <g clip-path="url(#in)">
    <rect width="320" height="200" fill="#c79a63"/>
    <g stroke="#a87a48" stroke-width="2"><path d="M0 40H320M0 80H320M0 120H320M0 160H320M60 0V40M150 40V80M30 80V120M110 120V160M70 160V200"/></g>
  </g>
  <g clip-path="url(#out)">
