<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。鉛筆から太陽まで、だんだん大きくなる対象を削る -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d251b"/>
      <stop offset="1" stop-color="#120f0b"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6f9c"/>
      <stop offset="1" stop-color="#2b3550"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- 星 -->
  <g fill="#f3ece2" opacity="0.55">
    <circle cx="30" cy="24" r="1.2"/><circle cx="92" cy="40" r="1"/><circle cx="150" cy="18" r="1.3"/>
    <circle cx="200" cy="52" r="1"/><circle cx="58" cy="70" r="0.9"/>
  </g>
  <!-- 太陽 (ゴール) -->
  <circle cx="272" cy="46" r="58" fill="url(#sun)"/>
  <circle cx="272" cy="46" r="26" fill="#ffd56a"/>
  <!-- 山 (上が削られている) -->
  <path d="M120 176 L176 98 L190 104 L200 96 L214 106 L226 100 L288 176 Z" fill="url(#mt)"/>
  <path d="M176 98 L190 104 L200 96 L214 106 L226 100 L232 108 L214 116 L200 110 L186 118 L170 106 Z" fill="#e9eef7" opacity="0.9"/>
  <!-- 削りカス -->
  <g fill="#ffb347">
    <rect x="188" y="78" width="6" height="6" rx="1" transform="rotate(20 191 81)"/>
    <rect x="210" y="70" width="5" height="5" rx="1" transform="rotate(-15 212 72)"/>
    <rect x="198" y="58" width="4" height="4" rx="1"/>
    <rect x="224" y="82" width="4" height="4" rx="1" fill="#a89a88"/>
    <rect x="178" y="66" width="3" height="3" rx="1" fill="#a89a88"/>
  </g>
  <!-- 鉛筆 (スタート) -->
  <g transform="translate(40 150) rotate(-35)">
    <rect x="0" y="0" width="60" height="12" rx="2" fill="#ffb347"/>
    <rect x="0" y="0" width="60" height="4" fill="#ffd56a"/>
    <rect x="-8" y="0" width="9" height="12" rx="2" fill="#e8746a"/>
    <path d="M60 0 L74 6 L60 12 Z" fill="#f3d9b5"/>
    <path d="M69 3.8 L74 6 L69 8.2 Z" fill="#2a241c"/>
  </g>
  <!-- 地面 -->
  <rect y="176" width="320" height="24" fill="#1a150f"/>
</svg>
