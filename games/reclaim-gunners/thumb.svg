<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。左が解放済みの明るい麦畑、右が魔巣のある紫の霧のエリア -->
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#3a0a4a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3a0a4a" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="nest" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff4a8a"/>
      <stop offset="0.6" stop-color="#8a1f5a"/>
      <stop offset="1" stop-color="#3a0a2a"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="#c8a64a"/>
  <g fill="#b08f36" opacity="0.5">
    <rect y="20" width="320" height="4"/><rect y="60" width="320" height="4"/><rect y="100" width="320" height="4"/><rect y="140" width="320" height="4"/><rect y="180" width="320" height="4"/>
  </g>
  <rect x="190" width="130" height="200" fill="#6d6862"/>
  <rect width="320" height="200" fill="url(#fog)"/>
  <!-- 魔巣 -->
  <g transform="translate(262,92)" stroke="#4a1030" stroke-width="4" fill="none">
    <path d="M0,0 Q28,-10 44,-30"/><path d="M0,0 Q30,14 46,30"/><path d="M0,0 Q-6,30 -10,46"/><path d="M0,0 Q-30,-8 -44,-18"/><path d="M0,0 Q4,-30 10,-46"/>
  </g>
  <circle cx="262" cy="92" r="26" fill="url(#nest)"/>
  <circle cx="254" cy="84" r="5" fill="#ffd0e6" opacity="0.7"/>
  <!-- インプ -->
  <g transform="translate(220,150)">
    <path d="M-2,-1 L-14,-8 L-9,4Z M2,-1 L14,-8 L9,4Z" fill="#7a1f1f"/>
    <circle r="8" fill="#d8433a"/><circle cx="-3" cy="-1" r="1.8" fill="#ffe45c"/><circle cx="3" cy="-1" r="1.8" fill="#ffe45c"/>
  </g>
  <g transform="translate(290,160)">
    <path d="M-2,-1 L-14,-8 L-9,4Z M2,-1 L14,-8 L9,4Z" fill="#7a1f1f"/>
    <circle r="8" fill="#d8433a"/><circle cx="-3" cy="-1" r="1.8" fill="#ffe45c"/><circle cx="3" cy="-1" r="1.8" fill="#ffe45c"/>
  </g>
  <!-- 弾 -->
  <g stroke="#fff3b0" stroke-width="3" stroke-linecap="round">
    <line x1="140" y1="104" x2="154" y2="101"/><line x1="176" y1="98" x2="190" y2="96"/><line x1="210" y1="94" x2="224" y2="93"/>
  </g>
  <!-- 主人公 -->
  <g transform="translate(108,112) scale(3.2)">
    <ellipse cy="7" rx="7" ry="3" fill="#000" opacity="0.3"/>
    <rect x="-4" y="4" width="3" height="4" fill="#2a2430"/><rect x="1" y="4" width="3" height="4" fill="#2a2430"/>
    <ellipse cy="1" rx="6.2" ry="6" fill="#4a7fd4"/>
    <circle cy="-5" r="4.3" fill="#f1d3b0"/>
    <path d="M-4.5,-6 A4.5,4.5 0 0 1 4.5,-6Z" fill="#5a3a20"/>
    <rect x="-4.5" y="-7" width="9" height="1.6" fill="#e8c46a"/>
    <circle cx="0.4" cy="-5" r="0.9" fill="#2a2020"/><circle cx="3.2" cy="-5" r="0.9" fill="#2a2020"/>
    <rect x="3" y="-2.5" width="11" height="3" fill="#2a2a30" transform="rotate(-8)"/>
  </g>
  <text x="16" y="34" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#fff" stroke="#3a1a5c" stroke-width="5" paint-order="stroke">魔境奪還</text>
</svg>
