<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。夕暮れのウィーンで、指揮棒のベートーヴェンが紳士の傘をうち破る -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b3d"/>
      <stop offset="0.6" stop-color="#5b3b6b"/>
      <stop offset="1" stop-color="#f4c27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <circle cx="262" cy="34" r="16" fill="#fffae6" opacity="0.9"/>
  <!-- 街並み -->
  <g fill="#a98f86">
    <rect x="0" y="70" width="70" height="90"/><rect x="74" y="56" width="60" height="104"/><rect x="200" y="64" width="64" height="96"/><rect x="268" y="80" width="52" height="80"/>
  </g>
  <g fill="#4a3d5c">
    <polygon points="-4,70 35,50 74,70"/><polygon points="70,56 104,36 138,56"/><polygon points="196,64 232,44 268,64"/><polygon points="264,80 294,60 324,80"/>
  </g>
  <g fill="#ffd98a" opacity="0.85">
    <rect x="10" y="84" width="9" height="13" rx="4"/><rect x="30" y="84" width="9" height="13" rx="4"/><rect x="50" y="110" width="9" height="13" rx="4"/>
    <rect x="86" y="72" width="9" height="13" rx="4"/><rect x="112" y="100" width="9" height="13" rx="4"/><rect x="212" y="80" width="9" height="13" rx="4"/>
    <rect x="240" y="108" width="9" height="13" rx="4"/><rect x="280" y="94" width="9" height="13" rx="4"/>
  </g>
  <rect y="158" width="320" height="42" fill="#4a3d4c"/>
  <g stroke="#2c2230" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="170" x2="320" y2="170"/><line x1="0" y1="184" x2="320" y2="184"/>
  </g>
  <!-- 拍の五線 -->
  <g stroke="#ffe7a0" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="0" y1="186" x2="320" y2="186"/><line x1="0" y1="190" x2="320" y2="190"/><line x1="0" y1="194" x2="320" y2="194"/>
  </g>
  <line x1="96" y1="178" x2="96" y2="200" stroke="#ffe7a0" stroke-width="3"/>
  <g fill="#fff"><ellipse cx="140" cy="190" rx="5" ry="3.5"/><ellipse cx="184" cy="190" rx="5" ry="3.5"/><ellipse cx="228" cy="190" rx="5" ry="3.5"/><ellipse cx="272" cy="190" rx="5" ry="3.5"/></g>
  <!-- 振りの軌跡と光 -->
  <circle cx="190" cy="104" r="46" fill="url(#glow)"/>
  <path d="M120 70 A64 64 0 0 1 196 128" fill="none" stroke="#ffd84a" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M122 72 A62 62 0 0 1 194 126" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ベートーヴェン -->
  <g transform="translate(108 160)">
    <line x1="-4" y1="-30" x2="-10" y2="-2" stroke="#1b1b22" stroke-width="7" stroke-linecap="round"/>
    <line x1="5" y1="-30" x2="12" y2="-2" stroke="#1b1b22" stroke-width="7" stroke-linecap="round"/>
    <polygon points="-11,-68 11,-68 13,-36 3,-32 -10,-14 -17,-17 -14,-42" fill="#244a3a"/>
    <polygon points="1,-67 10,-67 10,-38 3,-36" fill="#8a1c24"/>
    <polygon points="-1,-70 10,-70 7,-59 3,-56" fill="#fff"/>
    <ellipse cx="3" cy="-80" rx="9" ry="10.5" fill="#e9b98f"/>
    <g fill="#d8d6d0">
      <ellipse cx="-8" cy="-86" rx="7" ry="5"/><ellipse cx="-3" cy="-93" rx="7" ry="5"/><ellipse cx="6" cy="-94" rx="6" ry="4.5"/><ellipse cx="-10" cy="-77" rx="6" ry="6"/><ellipse cx="-6" cy="-70" rx="5" ry="5"/>
    </g>
    <line x1="4" y1="-84" x2="11" y2="-82" stroke="#3a2418" stroke-width="2"/>
    <line x1="4" y1="-64" x2="26" y2="-56" stroke="#2b5444" stroke-width="6" stroke-linecap="round"/>
    <line x1="26" y1="-56" x2="62" y2="-38" stroke="#f8f4e8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="62" cy="-38" r="6" fill="#fff8d0"/>
  </g>
  <!-- 傘を割られる紳士 -->
  <g transform="translate(222 160)">
    <line x1="-4" y1="-30" x2="-8" y2="-2" stroke="#3a3a44" stroke-width="7" stroke-linecap="round"/>
    <line x1="5" y1="-30" x2="9" y2="-2" stroke="#3a3a44" stroke-width="7" stroke-linecap="round"/>
    <polygon points="11,-66 -11,-66 -13,-34 9,-14 15,-17 13,-42" fill="#25304d"/>
    <polygon points="-1,-66 -9,-66 -6,-48" fill="#f4f1e8"/>
    <ellipse cx="-2" cy="-78" rx="8.5" ry="10" fill="#f2cfae"/>
    <ellipse cx="-7" cy="-73" rx="6.5" ry="2.5" fill="#c9b9a0"/>
    <circle cx="-7" cy="-81" r="3.5" fill="none" stroke="#e6c35a" stroke-width="1.2"/>
    <rect x="-12" y="-110" width="19" height="22" fill="#0e0e12"/><rect x="-16" y="-90" width="27" height="4" fill="#0e0e12"/><rect x="-12" y="-95" width="19" height="4" fill="#7a1f2b"/>
    <!-- 割れた傘 -->
    <path d="M-30 -110 Q-52 -78 -30 -46 L-18 -78 Z" fill="#15151a" transform="rotate(-18 -24 -78)"/>
    <path d="M-34 -70 Q-46 -50 -30 -30 L-22 -56 Z" fill="#15151a" transform="rotate(24 -28 -50)"/>
  </g>
  <!-- 演出 -->
  <g fill="#ffd84a" font-family="serif" font-size="20">
    <text x="176" y="70">♪</text><text x="236" y="56">♫</text><text x="160" y="140">♬</text><text x="268" y="122">♪</text>
  </g>
  <text x="196" y="40" font-family="sans-serif" font-weight="bold" font-style="italic" font-size="18" fill="#ffa24a" stroke="#2a1020" stroke-width="3" paint-order="stroke">BREAK!</text>
  <g fill="#fff"><circle cx="210" cy="90" r="2"/><circle cx="200" cy="120" r="1.6"/><circle cx="184" cy="84" r="1.8"/></g>
</svg>
