<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。動物の絵は script.js の DRAW と同じ形 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8f8"/>
      <stop offset="1" stop-color="#d4f0ff"/>
    </linearGradient>
    <clipPath id="above-rim"><rect x="-10" y="-40" width="120" height="140"/></clipPath>
  </defs>

  <rect width="320" height="200" fill="url(#sky)"/>

  <!-- 虹 -->
  <g fill="none" stroke-width="7" opacity="0.45">
    <circle cx="150" cy="190" r="128" stroke="#f7a8a8"/>
    <circle cx="150" cy="190" r="121" stroke="#f9d29a"/>
    <circle cx="150" cy="190" r="114" stroke="#f6ef9c"/>
    <circle cx="150" cy="190" r="107" stroke="#b5e6a5"/>
    <circle cx="150" cy="190" r="100" stroke="#a9d4f5"/>
    <circle cx="150" cy="190" r="93" stroke="#c9b6ef"/>
  </g>

  <!-- 太陽と雲 -->
  <g transform="translate(278 34)">
    <g stroke="#ffc93c" stroke-width="3" stroke-linecap="round">
      <path d="M0 -26v6M0 20v6M-26 0h6M20 0h6M-18 -18l4 4M14 14l4 4M-18 18l4 -4M14 -14l4 -4"/>
    </g>
    <circle r="15" fill="#ffd84d"/>
    <circle cx="-5" cy="-2" r="1.8" fill="#6b4a1e"/><circle cx="5" cy="-2" r="1.8" fill="#6b4a1e"/>
    <path d="M-5 5q5 4 10 0" stroke="#6b4a1e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <g fill="#fff" opacity="0.95">
    <ellipse cx="46" cy="36" rx="22" ry="9"/><ellipse cx="58" cy="30" rx="14" ry="10"/><ellipse cx="36" cy="31" rx="10" ry="7"/>
  </g>

  <!-- 丘と木 -->
  <path d="M0 112Q60 84 130 104T260 96T320 100V200H0Z" fill="#9bd27a"/>
  <g>
    <rect x="31" y="84" width="3" height="18" fill="#7a5a3a"/><circle cx="32.5" cy="82" r="10" fill="#5ea443"/>
    <rect x="281" y="78" width="3" height="20" fill="#7a5a3a"/><circle cx="282.5" cy="75" r="11" fill="#5ea443"/>
  </g>
  <path d="M0 130Q80 112 160 124T320 120V200H0Z" fill="#7cc35a"/>

  <!-- 草花 -->
  <g>
    <g fill="#fff"><circle cx="22" cy="182" r="3"/><circle cx="18" cy="186" r="3"/><circle cx="26" cy="186" r="3"/><circle cx="20" cy="190" r="3"/><circle cx="24" cy="190" r="3"/></g><circle cx="22" cy="187" r="2.2" fill="#ffd23f"/>
    <g fill="#ffd23f"><circle cx="298" cy="176" r="3"/><circle cx="294" cy="180" r="3"/><circle cx="302" cy="180" r="3"/><circle cx="296" cy="184" r="3"/><circle cx="300" cy="184" r="3"/></g><circle cx="298" cy="181" r="2.2" fill="#fff"/>
    <g fill="#f4b6c2"><circle cx="160" cy="186" r="2.6"/><circle cx="156.5" cy="189.5" r="2.6"/><circle cx="163.5" cy="189.5" r="2.6"/><circle cx="158" cy="193" r="2.6"/><circle cx="162" cy="193" r="2.6"/></g><circle cx="160" cy="190" r="2" fill="#ffd23f"/>
    <path d="M90 196q2-10 6-14M96 196q0-8-4-12M232 194q2-10 6-14M238 194q0-8-4-12" stroke="#5ea443" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

