  <!-- モグラ (まん中の穴、手前で大きく) -->
  <g transform="translate(160 176)">
    <ellipse rx="44" ry="13" fill="#3b2a1e"/>
    <g transform="translate(-35 -70) scale(0.7)" clip-path="url(#above-rim)">
      <rect x="8" y="8" width="84" height="120" rx="42" fill="#8b5a3c"/>
      <ellipse cx="50" cy="92" rx="27" ry="24" fill="#d9b48f"/>
      <circle cx="36" cy="46" r="4.5" fill="#1b1b1b"/><circle cx="37.6" cy="44.4" r="1.6" fill="#fff"/>
      <circle cx="64" cy="46" r="4.5" fill="#1b1b1b"/><circle cx="65.6" cy="44.4" r="1.6" fill="#fff"/>
      <ellipse cx="26" cy="60" rx="6" ry="4" fill="#f29aa6" opacity="0.6"/><ellipse cx="74" cy="60" rx="6" ry="4" fill="#f29aa6" opacity="0.6"/>
      <ellipse cx="50" cy="60" rx="9" ry="7" fill="#e86b7a"/>
      <ellipse cx="30" cy="96" rx="9" ry="6" fill="#f0c7a8"/><ellipse cx="70" cy="96" rx="9" ry="6" fill="#f0c7a8"/>
    </g>
    <path d="M-44 0a44 13 0 0 0 88 0a44 17 0 0 1 -88 0z" fill="#5ea443"/>
  </g>

  <!-- ピコピコハンマー -->
  <g transform="translate(206 92) rotate(28)">
    <rect x="-3.5" y="0" width="7" height="46" rx="3" fill="#f2c14e"/>
    <rect x="-24" y="-16" width="48" height="22" rx="10" fill="#ef5a5a"/>
    <rect x="-24" y="-16" width="9" height="22" rx="4" fill="#ffe3a3"/>
    <rect x="15" y="-16" width="9" height="22" rx="4" fill="#ffe3a3"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M236 66l6-8M244 78l9-3M246 92l9 1"/>
  </g>
</svg>
