  <g transform="translate(70 162)">
    <ellipse rx="34" ry="10" fill="#3b2a1e"/>
    <g transform="translate(-27 -54.6) scale(0.54)" clip-path="url(#above-rim)">
      <g transform="rotate(-8 30 24)"><rect x="22" y="-26" width="17" height="54" rx="8.5" fill="#efebe6"/><rect x="26.5" y="-20" width="8" height="40" rx="4" fill="#f4b6c2"/></g>
      <g transform="rotate(8 70 24)"><rect x="61" y="-26" width="17" height="54" rx="8.5" fill="#efebe6"/><rect x="65.5" y="-20" width="8" height="40" rx="4" fill="#f4b6c2"/></g>
      <rect x="8" y="8" width="84" height="120" rx="42" fill="#efebe6"/>
      <ellipse cx="50" cy="92" rx="27" ry="24" fill="#fff"/>
      <circle cx="35" cy="44" r="5" fill="#1b1b1b"/><circle cx="36.75" cy="42.25" r="1.75" fill="#fff"/>
      <circle cx="65" cy="44" r="5" fill="#1b1b1b"/><circle cx="66.75" cy="42.25" r="1.75" fill="#fff"/>
      <ellipse cx="26" cy="58" rx="6" ry="4" fill="#f29aa6" opacity="0.6"/><ellipse cx="74" cy="58" rx="6" ry="4" fill="#f29aa6" opacity="0.6"/>
      <path d="M45.5 54h9l-4.5 4.5z" fill="#e86b7a"/>
      <path d="M50 58.5q-4 6-9 3M50 58.5q4 6 9 3" stroke="#7a5a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <path d="M-34 0a34 10 0 0 0 68 0a34 13 0 0 1 -68 0z" fill="#5ea443"/>
  </g>

  <!-- タヌキ (右の穴) -->
  <g transform="translate(250 162)">
    <ellipse rx="34" ry="10" fill="#3b2a1e"/>
    <g transform="translate(-27 -54) scale(0.54)" clip-path="url(#above-rim)">
      <circle cx="24" cy="16" r="11" fill="#4a3626"/><circle cx="76" cy="16" r="11" fill="#4a3626"/>
      <rect x="8" y="8" width="84" height="120" rx="42" fill="#9a7350"/>
      <ellipse cx="50" cy="92" rx="27" ry="24" fill="#e3cfae"/>
      <ellipse cx="35" cy="48" rx="13" ry="10" fill="#4a3626" transform="rotate(15 35 48)"/>
      <ellipse cx="65" cy="48" rx="13" ry="10" fill="#4a3626" transform="rotate(-15 65 48)"/>
      <circle cx="35" cy="47" r="6.5" fill="#fff"/><circle cx="35" cy="47" r="4" fill="#1b1b1b"/><circle cx="36.4" cy="45.6" r="1.4" fill="#fff"/>
      <circle cx="65" cy="47" r="6.5" fill="#fff"/><circle cx="65" cy="47" r="4" fill="#1b1b1b"/><circle cx="66.4" cy="45.6" r="1.4" fill="#fff"/>
      <ellipse cx="50" cy="63" rx="14" ry="10" fill="#e8d6b6"/>
      <ellipse cx="50" cy="58" rx="6" ry="4.5" fill="#2a1d14"/>
    </g>
    <path d="M-34 0a34 10 0 0 0 68 0a34 13 0 0 1 -68 0z" fill="#5ea443"/>
