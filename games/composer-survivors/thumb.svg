<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- ゲーム一覧 (games/index.html) のタイル画像。ボスから音符があふれ、作曲家が楽器で迎え撃つ -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#5a2340"/>
      <stop offset="1" stop-color="#160d1c"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="40" x2="320" y2="40"/><line x1="0" y1="52" x2="320" y2="52"/><line x1="0" y1="64" x2="320" y2="64"/><line x1="0" y1="76" x2="320" y2="76"/><line x1="0" y1="88" x2="320" y2="88"/>
  </g>
  <!-- ボス (星) と結界 -->
  <g transform="translate(160 62)">
    <ellipse rx="44" ry="24" fill="none" stroke="#fff0c8" stroke-opacity="0.7" stroke-width="2"/>
    <ellipse rx="52" ry="29" fill="none" stroke="#fff0c8" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="0,-28 8,-9 27,-9 12,4 18,24 0,12 -18,24 -12,4 -27,-9 -8,-9" fill="#ffd93b" stroke="#5a4300" stroke-width="3"/>
    <circle cx="-6" cy="-1" r="2.5" fill="#222"/><circle cx="6" cy="-1" r="2.5" fill="#222"/>
  </g>
  <!-- 音符 -->
  <g stroke="#111" stroke-width="2.5">
    <g transform="translate(70 120)"><line x1="9" y1="-2" x2="9" y2="-30"/><path d="M9 -30 q12 8 6 16" fill="none"/><ellipse rx="11" ry="8.5" transform="rotate(-20)" fill="#e74c3c"/></g>
    <g transform="translate(250 112)"><line x1="9" y1="-2" x2="9" y2="-30"/><ellipse rx="11" ry="8.5" transform="rotate(-20)" fill="#3498db"/></g>
    <g transform="translate(112 160)"><ellipse rx="15" ry="11" transform="rotate(-20)" fill="#9b59b6"/><ellipse rx="9" ry="5" transform="rotate(-50)" fill="#fbf6ea" stroke="none"/></g>
    <g transform="translate(212 162)"><line x1="8" y1="-2" x2="8" y2="-26"/><path d="M8 -26 q12 8 6 16 M8 -19 q12 8 6 16" fill="none"/><ellipse rx="9" ry="7" transform="rotate(-20)" fill="#2ecc71"/></g>
    <g transform="translate(40 70)"><line x1="7" y1="-2" x2="7" y2="-22"/><ellipse rx="8" ry="6" transform="rotate(-20)" fill="#f39c12"/></g>
    <g transform="translate(286 60)"><line x1="7" y1="-2" x2="7" y2="-22"/><path d="M7 -22 q10 7 5 14" fill="none"/><ellipse rx="8" ry="6" transform="rotate(-20)" fill="#1abc9c"/></g>
  </g>
  <g fill="#fff"><circle cx="66" cy="119" r="2"/><circle cx="74" cy="117" r="2"/><circle cx="246" cy="111" r="2"/><circle cx="254" cy="109" r="2"/><circle cx="107" cy="160" r="2.5"/><circle cx="117" cy="157" r="2.5"/></g>
  <!-- 作曲家 (ベートーヴェン) -->
  <g transform="translate(160 160)">
    <ellipse cx="0" cy="28" rx="18" ry="5" fill="#000" opacity="0.35"/>
    <path d="M-15 -4 H15 L18 22 H-18 Z" fill="#2d4a7a" stroke="#111" stroke-width="2"/>
    <path d="M-7 -5 H7 L0 8 Z" fill="#c0392b"/>
    <circle cy="-18" r="15" fill="#f2c9a0" stroke="#111" stroke-width="2"/>
    <path d="M-19 -14 L-20 -22 L-15 -32 L-8 -30 L-3 -37 L4 -31 L11 -35 L14 -27 L21 -24 L18 -12 L13 -20 L-13 -20 Z" fill="#3b3330"/>
    <circle cx="4" cy="-17" r="2" fill="#222"/><circle cx="10" cy="-17" r="2" fill="#222"/>
  </g>
  <!-- 衝撃波 -->
  <circle cx="160" cy="165" r="48" fill="none" stroke="#ffcf7a" stroke-width="4" opacity="0.7"/>
</svg>
